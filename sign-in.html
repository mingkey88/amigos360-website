<!DOCTYPE html>
<html lang="en-SG">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Amigos360</title>
  <meta name="description" content="Sign in to your Amigos360 dashboard.">

  <!-- Pre-launch. Remove both of these, and the Disallow in robots.txt, at sign-off. -->
  <meta name="robots" content="noindex, nofollow">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Jost:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <!-- Guide §1.4: the primary colour version is used wherever possible.
       TODO: this owl was derived by re-viewBox-ing the lockup, which §1.6
       lists as a don't. Request the approved favicon artwork from the client. -->
  <link rel="icon" href="assets/amigos360-owl-colour.svg" type="image/svg+xml">

  <!-- Scroll-reveal only hides content once JS is confirmed running.
       Webflow does the same thing with its w-mod-js class. -->
  <script>document.documentElement.className += " js-on";</script>
</head>
<body>

  <a class="skip-link" href="#main">Skip to main content</a>

  <!-- ===== NAVBAR (shared component — identical markup on every page) ===== -->
  <header class="navbar">
    <div class="container">
      <div class="navbar-inner">
        <a class="navbar-brand" href="index.html" aria-label="Amigos360 home">
          <!-- Guide §1.3: the lockup has a 200px digital floor and the wordmark
               a 150px one, so rather than undersize the lockup on a narrow
               canvas we step down to the wordmark and then to the symbol. CSS
               shows exactly one at a time. All three are alt="" because the
               link itself carries the accessible name. -->
          <img class="navbar-logo" src="assets/amigos360-full-logo-reverse-white.svg" alt="">
          <img class="navbar-wordmark" src="assets/amigos360-wordmark-reverse-white.svg" alt="">
          <img class="navbar-symbol" src="assets/amigos360-owl-reverse-white.svg" alt="">
        </a>

        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-menu" aria-label="Open menu">
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
        </button>

        <nav class="nav-menu" id="nav-menu" aria-label="Main">
          <a class="nav-link" href="portfolio.html">Portfolio</a>
          <a class="nav-link" href="pricing.html">Pricing</a>
          <a class="nav-link" href="faq.html">FAQ</a>
          <span class="nav-divider" aria-hidden="true"></span>
          <a class="nav-link" href="sign-in.html">Sign in</a>
          <a class="btn btn-primary nav-cta" href="book-a-call.html">Book a Discovery Call</a>
        </nav>
      </div>
    </div>
  </header>

  <main id="main">
    <section class="section-signin">
      <div class="signin-shape" aria-hidden="true"></div>
      <div class="container">
        <div class="signin-card reveal">
          <img class="signin-logo" src="assets/amigos360-wordmark-reverse-white.svg" alt="Amigos360">
          <h1 class="signin-title">Sign in</h1>

          <!-- Mockup only: no dashboard and no authentication behind this. -->
          <form class="signin-form" novalidate>
            <div class="form-field">
              <label class="form-label" for="signin-email">Email</label>
              <input class="form-input" type="email" id="signin-email" name="email" autocomplete="email">
            </div>
            <div class="form-field">
              <label class="form-label" for="signin-password">Password</label>
              <input class="form-input" type="password" id="signin-password" name="password"
                     autocomplete="current-password">
            </div>
            <button class="btn btn-primary btn-full" type="submit">Sign in</button>
          </form>

          <a class="forgot-link" href="#">Forgot password?</a>
        </div>
      </div>
    </section>
  </main>

  <!-- ===== FOOTER (shared component — identical markup on every page) ===== -->
  <footer class="footer">
    <div class="container">
      <div class="footer-inner">
        <div class="footer-brand">
          <img class="footer-logo" src="assets/amigos360-full-logo-reverse-white.svg" alt="Amigos360">
          <!-- TODO: optional one-line footer blurb — use .footer-blurb. Client copy required. -->
        </div>

        <div class="footer-col">
          <h2 class="footer-col-title">Sitemap</h2>
          <ul class="footer-list">
            <li><a class="footer-link" href="index.html">Home</a></li>
            <li><a class="footer-link" href="portfolio.html">Portfolio</a></li>
            <li><a class="footer-link" href="pricing.html">Pricing</a></li>
            <li><a class="footer-link" href="faq.html">FAQ</a></li>
          </ul>
        </div>

        <div class="footer-col">
          <h2 class="footer-col-title">Get started</h2>
          <ul class="footer-list">
            <li><a class="footer-link" href="book-a-call.html">Book a Discovery Call</a></li>
            <li><a class="footer-link" href="sign-in.html">Sign in</a></li>
          </ul>
        </div>
      </div>

      <div class="footer-base">
        <p class="footer-copy">© 2026 Amigos360</p>
        <!-- TODO: legal pages not in scope — links point nowhere until pages exist. -->
        <div class="footer-legal">
          <a class="footer-link" href="#">Privacy</a>
          <a class="footer-link" href="#">Terms</a>
        </div>
      </div>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
